Defaults.port = 45876

[Settings]
# Runs rootless, as the beszel-agent account, through that account's own
# materia. The scripts call forma, which creates the account.
User = "beszel-agent"
SetupScript = "beszel-agent-setup.sh"
PostScript = "beszel-agent-setup.sh"
CleanupScript = "beszel-agent-cleanup.sh"

[[Services]]
Service = "beszel-agent.service"

[Forma.Account]
Name = "beszel-agent"

[[Forma.Images]]
Tag = "beszel/beszel-agent:latest"
Containerfile = "build/Containerfile"

[Forma.Images.Update]
# Rebuild when the upstream tag moves
Schedule = "daily"
Triggers = ["base-digest"]

[Forma.SELinux]
# beszel_api_proxy.te: the proxy's domain (built with its .fc).
# beszel_agent.cil: the agent's container type, built on container-selinux's
# udica templates, loaded in the same transaction.
Modules = [
  "selinux/beszel_api_proxy.te",
  "selinux/beszel_agent.cil",
]
Templates = ["base_container", "net_container"]
# The program, after the account's materia writes it (the PostScript runs
# forma again). The home is forma's home_base on this host plus the account.
Relabel = ["/var/home/beszel-agent/.local/share/materia/components/beszel-agent/podman-api-proxy"]
